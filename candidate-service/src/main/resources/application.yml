spring:
  application:
    name: candidates
  datasource:
    url: jdbc:h2:file:./data/candidatesdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  h2:
    console:
      enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  kafka:
    topic: candidate-events

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    # Constraint violations can include column values; GlobalExceptionHandler logs a sanitized message instead.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
    # Hibernate 7 emits the same JDBC errors through this category.
    org.hibernate.orm.jdbc.error: "OFF"
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"